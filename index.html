<style>
:root{
  --navy-950:#060B18;
  --navy-900:#0A1128;
  --navy-850:#0E1730;
  --navy-800:#122040;
  --navy-700:#182b52;
  --blue-600:#2E5CF0;
  --blue-500:#4E7CFF;
  --blue-glow:#3A6BFF;
  --ice:#D9E4F7;
  --ice-dim:rgba(217,228,247,0.62);
  --ice-faint:rgba(217,228,247,0.34);
  --teal:#22C7A9;
  --amber:#F5A623;
  --red:#F1667A;
  --white:#FFFFFF;
  --line:rgba(217,228,247,0.10);
  --card:linear-gradient(160deg, rgba(46,92,240,0.16), rgba(14,23,48,0.55));
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 620px at 15% -10%, rgba(46,92,240,0.35), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(34,199,169,0.14), transparent 55%),
    var(--navy-950);
  color:var(--white);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

/* Header */
.appbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:12px;
  padding:16px 18px 14px;
  background:linear-gradient(180deg, rgba(6,11,24,0.96), rgba(6,11,24,0.78) 70%, transparent);
  backdrop-filter:blur(10px);
}
.logo-badge{
  width:42px;height:42px;border-radius:14px;overflow:hidden;flex-shrink:0;
  box-shadow:0 6px 18px rgba(46,92,240,0.35), inset 0 0 0 1px rgba(255,255,255,0.08);
}
.logo-badge img{width:100%;height:100%;object-fit:cover;display:block;}
.appbar-titles{flex:1; min-width:0;}
.appbar-titles h1{font-family:'Manrope',sans-serif; font-size:15.5px; font-weight:800; margin:0; letter-spacing:-0.01em; line-height:1.25;}
.appbar-titles p{margin:1px 0 0; font-size:11.5px; color:var(--ice-dim); font-weight:500;}
.sync-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,0.03); display:flex;align-items:center;justify-content:center;
  color:var(--ice); flex-shrink:0; cursor:pointer;
}
.sync-btn svg{width:18px;height:18px;}
.sync-btn.spinning svg{animation:spin 0.9s linear infinite;}
.install-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid rgba(78,124,255,0.4);
  background:linear-gradient(135deg,var(--blue-600),var(--blue-500)); display:flex;align-items:center;justify-content:center;
  color:#fff; flex-shrink:0; cursor:pointer; box-shadow:0 4px 14px rgba(46,92,240,0.4);
  animation:installPulse 2s ease-in-out infinite;
}
.install-btn svg{width:18px;height:18px;}
@keyframes installPulse{0%,100%{box-shadow:0 4px 14px rgba(46,92,240,0.4);}50%{box-shadow:0 4px 20px rgba(46,92,240,0.7);}}
@keyframes spin{to{transform:rotate(360deg);}}

/* Sync status strip */
.sync-strip{
  margin:0 18px 8px; font-size:11px; color:var(--ice-faint); display:flex; align-items:center; gap:6px;
}
.dot{width:6px;height:6px;border-radius:50%; background:var(--teal); flex-shrink:0;}
.dot.err{background:var(--red);}
.dot.loading{background:var(--amber); animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

main{flex:1; padding:4px 18px 96px;}

/* Tabs */
.tabs{display:flex; gap:6px; margin:6px 0 18px; background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:14px; padding:4px;}
.tab-btn{flex:1; text-align:center; padding:10px 0; border-radius:11px; font-size:13px; font-weight:700; font-family:'Manrope',sans-serif; color:var(--ice-dim); background:transparent; border:none; cursor:pointer; letter-spacing:0.01em;}
.tab-btn.active{background:linear-gradient(135deg,var(--blue-600),var(--blue-500)); color:#fff; box-shadow:0 4px 14px rgba(46,92,240,0.4);}

.view{display:none;}
.view.active{display:block; animation:fadeUp 0.35s ease both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* Hero KPI */
.hero{
  background:var(--card); border:1px solid var(--line); border-radius:22px; padding:22px 20px;
  position:relative; overflow:hidden; margin-bottom:14px;
}
.hero::after{content:'';position:absolute; width:180px; height:180px; right:-60px; top:-70px; border-radius:50%; background:radial-gradient(circle, rgba(78,124,255,0.35), transparent 70%);}
.hero-label{font-size:11.5px; color:var(--ice-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; position:relative;}
.hero-value{font-family:'Manrope',sans-serif; font-size:34px; font-weight:800; letter-spacing:-0.02em; margin:4px 0 2px; position:relative;}
.hero-sub{font-size:12.5px; color:var(--ice-dim); position:relative;}

.stat-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.stat-card{background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:16px; padding:14px 15px;}
.stat-card .k{font-size:10.5px; color:var(--ice-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.05em;}
.stat-card .v{font-family:'Manrope',sans-serif; font-size:19px; font-weight:800; margin-top:4px; letter-spacing:-0.01em;}
.stat-card .v.small{font-size:15px;}

/* Section headers */
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin:22px 0 12px;}
.section-head h2{font-family:'Manrope',sans-serif; font-size:15px; font-weight:800; margin:0; letter-spacing:-0.01em;}
.section-head span{font-size:11.5px; color:var(--ice-dim);}

/* Chart */
.chart-card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px 16px 14px; margin-bottom:6px;}
.bars{display:flex; align-items:flex-end; gap:6px; height:120px; padding:0 2px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; cursor:pointer;}
.bar{width:100%; max-width:22px; border-radius:6px 6px 3px 3px; background:linear-gradient(180deg,var(--blue-500),var(--blue-600)); transition:transform 0.15s;}
.bar-col:active .bar{transform:scaleY(0.96);}
.bar.status-complete{background:linear-gradient(180deg,#3EE0BE,var(--teal));}
.bar.status-review{background:linear-gradient(180deg,#FFC768,var(--amber));}
.bar.status-empty{background:rgba(255,255,255,0.08);}
.bar-lbl{font-size:9.5px; color:var(--ice-faint); margin-top:6px; font-weight:600;}
.legend{display:flex; gap:14px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); flex-wrap:wrap;}
.legend-item{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ice-dim);}
.legend-dot{width:7px;height:7px;border-radius:2px;}

/* Category bars */
.cat-list{display:flex; flex-direction:column; gap:12px;}
.cat-row .cat-top{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px;}
.cat-row .cat-top .name{font-weight:600; color:var(--ice);}
.cat-row .cat-top .amt{font-weight:700; color:#fff; font-variant-numeric:tabular-nums;}
.cat-track{height:8px; border-radius:5px; background:rgba(255,255,255,0.06); overflow:hidden;}
.cat-fill{height:100%; border-radius:5px; background:linear-gradient(90deg,var(--blue-600),var(--blue-glow));}

/* Month list */
.month-list{display:flex; flex-direction:column; gap:8px;}
.month-row{
  display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.025);
  border:1px solid var(--line); border-radius:16px; padding:12px 14px; cursor:pointer;
}
.month-row:active{background:rgba(255,255,255,0.05);}
.month-badge{width:40px;height:40px;border-radius:12px; background:rgba(78,124,255,0.14); display:flex;align-items:center;justify-content:center; font-family:'Manrope',sans-serif; font-weight:800; font-size:11.5px; color:var(--blue-500); flex-shrink:0;}
.month-info{flex:1; min-width:0;}
.month-info .name{font-weight:700; font-size:13.5px;}
.month-info .status{font-size:11px; margin-top:1px;}
.month-amt{font-weight:800; font-size:14px; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;}
.status-pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:9.5px; font-weight:700; letter-spacing:0.02em;}
.status-pill.ok{background:rgba(34,199,169,0.16); color:var(--teal);}
.status-pill.review{background:rgba(245,166,35,0.16); color:var(--amber);}
.status-pill.empty{background:rgba(255,255,255,0.06); color:var(--ice-faint);}

/* Records view */
.month-chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none;}
.month-chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0; padding:8px 15px; border-radius:20px; border:1px solid var(--line); background:rgba(255,255,255,0.03); font-size:12.5px; font-weight:700; color:var(--ice-dim); cursor:pointer;}
.chip.active{background:linear-gradient(135deg,var(--blue-600),var(--blue-500)); color:#fff; border-color:transparent;}

.subtabs{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; scrollbar-width:none;}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{flex-shrink:0; padding:7px 13px; border-radius:10px; font-size:11.5px; font-weight:700; color:var(--ice-dim); background:rgba(255,255,255,0.03); border:1px solid var(--line); cursor:pointer;}
.subtab.active{background:rgba(78,124,255,0.16); color:var(--blue-500); border-color:rgba(78,124,255,0.3);}

.rec-card{background:rgba(255,255,255,0.025); border:1px solid var(--line); border-radius:16px; padding:14px 15px; margin-bottom:10px;}
.rec-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
.rec-cat{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--blue-500); background:rgba(78,124,255,0.12); padding:3px 8px; border-radius:6px; display:inline-block;}
.rec-amt{font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; white-space:nowrap; font-variant-numeric:tabular-nums;}
.rec-title{font-size:12.5px; font-weight:600; color:var(--ice); margin:8px 0 4px; line-height:1.4;}
.rec-meta{font-size:11px; color:var(--ice-dim); line-height:1.5;}
.rec-meta b{color:var(--ice-dim); font-weight:600;}
.rec-status{margin-top:8px;}

.empty-state{text-align:center; padding:40px 20px; color:var(--ice-dim);}
.empty-state svg{width:38px;height:38px; opacity:0.4; margin-bottom:10px;}
.empty-state p{font-size:12.5px; margin:0;}

.search-box{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:14px;}
.search-box svg{width:16px;height:16px; color:var(--ice-faint); flex-shrink:0;}
.search-box input{flex:1; background:none; border:none; outline:none; color:#fff; font-size:13px; font-family:'Inter',sans-serif;}
.search-box input::placeholder{color:var(--ice-faint);}

/* Bottom nav */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  max-width:480px; margin:0 auto;
  background:rgba(10,17,40,0.92); backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex; padding:8px 10px calc(10px + env(safe-area-inset-bottom));
}
.nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; background:none; border:none; color:var(--ice-faint); cursor:pointer;}
.nav-btn svg{width:21px;height:21px;}
.nav-btn.active{color:var(--blue-500);}
.nav-btn span{font-size:10px; font-weight:700;}

.loading-overlay{position:fixed; inset:0; background:var(--navy-950); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;}
.loading-overlay img{width:64px;height:64px;border-radius:18px; box-shadow:0 8px 30px rgba(46,92,240,0.4);}
.loading-overlay .spin{width:26px;height:26px;border-radius:50%; border:3px solid rgba(78,124,255,0.2); border-top-color:var(--blue-500); animation:spin 0.8s linear infinite;}
.loading-overlay p{color:var(--ice-dim); font-size:12.5px; margin:0;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy-800); border:1px solid var(--line); padding:10px 18px; border-radius:30px; font-size:12px; color:var(--ice); opacity:0; pointer-events:none; transition:all 0.3s; z-index:60; white-space:nowrap; box-shadow:0 10px 30px rgba(0,0,0,0.4);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

::-webkit-scrollbar{width:0;height:0;}
</style>
</head>

    let done = false;
    const timer = setTimeout(()=>{ if(!done){ done=true; cleanup(); reject(new Error('timeout')); } }, timeoutMs);
    function cleanup(){ clearTimeout(timer); delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = function(json){
      if(done) return;
      done = true;
      cleanup();
      try{
        if(!json || !json.table){ reject(new Error('bad response')); return; }
        const numCols = FETCH_COLS.length;
        const rows = (json.table.rows||[]).map(r=>{
          const arr = new Array(numCols).fill(null);
          (r.c||[]).forEach((cell,i)=>{ arr[i] = cell ? cell.v : null; });
          return arr;
        });
        resolve(rows);
      }catch(e){ reject(e); }
    };
    const tq = 'select ' + FETCH_COLS.join(',') + ' limit 130';
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cbName}&sheet=${encodeURIComponent(sheetName)}&tq=${encodeURIComponent(tq)}&headers=0&_=${Date.now()}`;
    script.src = url;
    script.onerror = ()=>{ if(!done){ done=true; cleanup(); reject(new Error('script load error')); } };
    document.body.appendChild(script);
  });
}

function num(v){ const p = parseAmount(v); return p===null ? 0 : p; }
function str(v){ return (v===null||v===undefined) ? null : String(v).trim(); }
function parseAmount(v){
  if(v===null||v===undefined) return null;
  if(typeof v==='number') return (Math.abs(v) > 2000000) ? null : v;
  const s = String(v).trim();
  if(s===''||s==='-') return null;
  const cleaned = s.replace(/RM/gi,'').replace(/,/g,'').trim();
  const f = parseFloat(cleaned);
  if(isNaN(f)) return null;
  if(Math.abs(f) > 2000000) return null;
  return f;
}

function findRowIdx(rows, matchText){
  return rows.findIndex(r => str(r[0]) === matchText);
}

// Parse one MONTH tab's compacted rows (GViz drops entirely-blank rows, so we anchor by label text, not fixed row numbers)
function parseMonthTab(abbr, label, rows){
  const statusIdx = findRowIdx(rows, 'MONTH STATUS');
  const status = statusIdx>=0 ? str(rows[statusIdx][1]) : null;
  const lastUpdated = statusIdx>=0 ? rows[statusIdx][8] : null;

  const utilHeaderIdx = findRowIdx(rows, 'UTILITIES');
  const summaryRow = utilHeaderIdx>=0 ? (rows[utilHeaderIdx+1]||[]) : [];
  const summary = {
    utilities: num(summaryRow[0]),
    fixedBills: num(summaryRow[2]),
    fuel: num(summaryRow[4]),
    other: num(summaryRow[6]),
    touchGo: num(summaryRow[8]),
  };

  const expenses = [];
  const fuel = [];
  const tg = [];
  const catHeaderIdx = findRowIdx(rows, 'Category');
  const erpSectionIdx = findRowIdx(rows, 'ERP (DIRECT + INDIRECT) - EXPENSE DETAILS');
  if(catHeaderIdx>=0){
    const endIdx = erpSectionIdx>=0 ? erpSectionIdx : rows.length;
    for(let i=catHeaderIdx+1; i<endIdx; i++){
      const c = rows[i] || [];
      const category = str(c[0]);
      const amtExp = parseAmount(c[2]);
      if(category && (amtExp!==null || str(c[5]))){
        expenses.push({ Month:abbr, Category:category, LocationSupplier:str(c[1]), Amount: amtExp, BillingPeriod:str(c[3]), AccountRef:str(c[4]), Remarks:str(c[5]) });
      }
      const vehicleF = str(c[7]);
      const amtF = parseAmount(c[8]);
      if(vehicleF && amtF>0) fuel.push({ Month:abbr, Vehicle:vehicleF, Amount:amtF });
      const vehicleT = str(c[10]);
      const amtT = parseAmount(c[11]);
      if(vehicleT && amtT>0) tg.push({ Month:abbr, Vehicle:vehicleT, Amount:amtT });
    }
  }

  const erp = [];
  let directTotal = 0, indirectTotal = 0;
  if(erpSectionIdx>=0){
    // erpSectionIdx = section title row; erpSectionIdx+1 = column-header row; data starts at +2
    for(let i=erpSectionIdx+2; i<rows.length; i++){
      const c = rows[i] || [];
      const no = c[0];
      if(typeof no === 'string' && no.toUpperCase().includes('TOTAL')) break;
      const isValidNo = no !== null && no !== undefined && String(no).trim() !== '';
      if(!isValidNo) continue;
      const amount = parseAmount(c[6]);
      const erpType = str(c[8]);
      const erpTypeUp = erpType ? erpType.toUpperCase() : '';
      if(erpTypeUp==='DIRECT') directTotal += (amount||0);
      else if(erpTypeUp==='INDIRECT') indirectTotal += (amount||0);
      erp.push({ Month:abbr, No:no, ERPDate:str(c[1]), ReceivedDate:str(c[2]), Category:str(c[3]), Description:str(c[4]), Supplier:str(c[5]), Amount:amount, Quantity:c[7], ERPType:erpType, Status:str(c[9]) });
    }
  }

  summary.directErp = directTotal;
  summary.indirectErp = indirectTotal;
  summary.total = summary.utilities+summary.fixedBills+summary.fuel+summary.other+summary.touchGo+directTotal+indirectTotal;

  return { abbr, label, status, lastUpdated, summary, expenses, fuel, tg, erp };
}

function mapStatus(raw){
  const s = (raw||'').toUpperCase();
  if(s.includes('BELUM') || s.includes('NOT ENTERED')) return 'NOT ENTERED';
  if(s.includes('PERLU SEMAKAN') || s.includes('REVIEW')) return 'REVIEW REQUIRED';
  if(s.includes('KEMAS KINI') || s.includes('UPDATING')) return 'UPDATING';
  if(s.includes('LENGKAP') || s.includes('COMPLETE')) return 'COMPLETE';
  if(s.includes('INDIRECT ONLY')) return 'INDIRECT ONLY';
  if(s.includes('DIRECT ONLY')) return 'DIRECT ONLY';
  return raw || 'NOT ENTERED';
}

function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

async function fetchMonthWithRetry(abbr, tabName, label, attempt=0){
  const rows = await fetchRangeJSONP(tabName, 'A1:N120');
  const parsed = parseMonthTab(abbr, label, rows);
  const looksEmpty = rows.length < 5 || findRowIdx(rows, 'MONTH STATUS') === -1;
  if(looksEmpty && attempt < 3){
    await sleep(400 + attempt*400);
    return fetchMonthWithRetry(abbr, tabName, label, attempt+1);
  }
  return parsed;
}

async function loadAllData(){
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'dot loading';
  txt.textContent = 'Menyegarkan…';
  try{
    const results = [];
    for(let i=0; i<MONTH_ORDER.length; i++){
      const abbr = MONTH_ORDER[i];
      results.push(fetchMonthWithRetry(abbr, SHEET_TAB_NAME[abbr], MONTH_LABEL[abbr]));
      await sleep(120); // stagger request start so we don't fire 12 at once
    }
    const settled = await Promise.all(results);

    // ---- TEMP DEBUG: per-month anchor diagnostics ----
    try{
      const dbgLines = [];
      for(let i=0;i<MONTH_ORDER.length;i++){
        const abbr = MONTH_ORDER[i];
        const rawRows = await fetchRangeJSONP(SHEET_TAB_NAME[abbr], 'A1:N120');
        const sIdx = findRowIdx(rawRows,'MONTH STATUS');
        const uIdx = findRowIdx(rawRows,'UTILITIES');
        const cIdx = findRowIdx(rawRows,'Category');
        const eIdx = findRowIdx(rawRows,'ERP (DIRECT + INDIRECT) - EXPENSE DETAILS');
        const total = settled[i].summary.total;
        dbgLines.push(`${abbr}: rows=${rawRows.length} status@${sIdx} util@${uIdx} cat@${cIdx} erp@${eIdx} => total=${total}`);
        await sleep(80);
      }
      const dbgEl = document.getElementById('debugPanel');
      if(dbgEl){ dbgEl.style.display='block'; dbgEl.textContent = dbgLines.join('\\n'); }
    }catch(dbgErr){
      const dbgEl = document.getElementById('debugPanel');
      if(dbgEl){ dbgEl.style.display='block'; dbgEl.textContent = 'DEBUG ERROR: '+dbgErr.message; }
    }

    const monthly = settled.map(m => ({
      Month: m.abbr, MonthLabel: m.label,
      Utilities: m.summary.utilities, FixedBills: m.summary.fixedBills, Fuel: m.summary.fuel,
      Other: m.summary.other, TouchGo: m.summary.touchGo,
      DirectERP: m.summary.directErp, IndirectERP: m.summary.indirectErp,
      Total: m.summary.total, Status: mapStatus(m.status), LastUpdated: m.lastUpdated,
    }));

    const ytdTotal = monthly.reduce((s,m)=>s+m.Total,0);
    const monthsWithTotal = monthly.filter(m=>m.Total>0);
    const average = monthsWithTotal.length ? ytdTotal/monthsWithTotal.length : 0;
    const highest = monthly.reduce((a,b)=> b.Total>a.Total?b:a, monthly[0]);

    const catSums = {Utilities:0,'Fixed Bills':0,Fuel:0,Other:0,'Touch & Go':0,'Direct ERP':0,'Indirect ERP':0};
    monthly.forEach(m=>{
      catSums['Utilities'] += m.Utilities; catSums['Fixed Bills'] += m.FixedBills; catSums['Fuel'] += m.Fuel;
      catSums['Other'] += m.Other; catSums['Touch & Go'] += m.TouchGo;
      catSums['Direct ERP'] += m.DirectERP; catSums['Indirect ERP'] += m.IndirectERP;
    });

    DATA.summary = { YTD_Total: ytdTotal, Average: average, Highest_Monthly_Cost: highest.Total, Highest_Month: highest.Month };
    DATA.monthly = monthly;
    DATA.categories = Object.entries(catSums).map(([Category,Total])=>({Category,Total}));
    DATA.expenses = settled.flatMap(m=>m.expenses);
    DATA.fuel = settled.flatMap(m=>m.fuel);
    DATA.tg = settled.flatMap(m=>m.tg);
    DATA.erp = settled.flatMap(m=>m.erp);

    dot.className = 'dot';
    const now = new Date();
    txt.textContent = 'Live · disegarkan ' + now.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'});
    renderAll();
    document.getElementById('loadingOverlay').style.display = 'none';
  }catch(e){
    console.error(e);
    dot.className = 'dot err';
    txt.textContent = 'Gagal menyambung — cuba segarkan semula';
    document.getElementById('loadingText').textContent = 'Tidak dapat memuatkan data. Pastikan Google Sheet dikongsi sebagai "Sesiapa yang ada pautan".';
    if(DATA.monthly.length){ document.getElementById('loadingOverlay').style.display = 'none'; }
  }
}

function renderAll(){
  renderHero();
  renderChart();
  renderCategories();
  renderMonthList();
  renderMonthChips();
  renderRecords();
}

function renderHero(){
  document.getElementById('ytdTotal').textContent = fmtRM(DATA.summary.YTD_Total);
  const monthsWithData = DATA.monthly.filter(m => Number(m.Total) > 0).length;
  document.getElementById('ytdSub').textContent = `${monthsWithData} bulan direkodkan · purata ${fmtRMshort(DATA.summary.Average)}/bulan`;
  document.getElementById('statAvg').textContent = fmtRM(DATA.summary.Average);
  document.getElementById('statHigh').textContent = (MONTH_LABEL[DATA.summary.Highest_Month]||DATA.summary.Highest_Month||'—') + ' · ' + fmtRMshort(DATA.summary.Highest_Monthly_Cost);
}

function statusClass(status){
  if(!status) return 'empty';
  const s = status.toUpperCase();
  if(s.includes('NOT ENTERED')) return 'empty';
  if(s.includes('COMPLETE') && !s.includes('INCOMPLETE')) return 'ok';
  if(s.includes('REVIEW') || s.includes('ONLY') || s.includes('UPDATING')) return 'review';
  return 'empty';
}
function statusLabel(status){
  if(!status) return 'Belum Diisi';
  const map = {
    'COMPLETE':'Lengkap','NOT ENTERED':'Belum Diisi','REVIEW REQUIRED':'Semakan Diperlukan',
    'DIRECT ONLY':'Direct Sahaja','INDIRECT ONLY':'Indirect Sahaja','UPDATING':'Sedang Dikemas Kini'
  };
  return map[status.toUpperCase()] || status;
}

function renderChart(){
  const el = document.getElementById('barsChart');
  const maxVal = Math.max(...DATA.monthly.map(m=>Number(m.Total)||0), 1);
  el.innerHTML = DATA.monthly.map(m=>{
    const val = Number(m.Total)||0;
    const h = Math.max(4, Math.round((val/maxVal)*100));
    const sc = statusClass(m.Status);
    const cls = sc==='ok' ? 'status-complete' : (sc==='review' ? 'status-review' : 'status-empty');
    return `<div class="bar-col" data-month="${m.Month}" onclick="jumpToMonth('${m.Month}')">
      <div class="bar ${cls}" style="height:${h}%"></div>
      <div class="bar-lbl">${m.Month}</div>
    </div>`;
  }).join('');
}

function renderCategories(){
  const cats = DATA.categories.slice().sort((a,b)=>Number(b.Total)-Number(a.Total));
  const total = cats.reduce((s,c)=>s+(Number(c.Total)||0),0);
  document.getElementById('catSub').textContent = fmtRM(total);
  document.getElementById('catList').innerHTML = cats.map(c=>{
    const v = Number(c.Total)||0;
    const pct = total>0 ? Math.round((v/total)*100) : 0;
    return `<div class="cat-row">
      <div class="cat-top"><span class="name">${c.Category}</span><span class="amt">${fmtRMshort(v)} <span style="color:var(--ice-faint);font-weight:500">· ${pct}%</span></span></div>
      <div class="cat-track"><div class="cat-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function renderMonthList(){
  document.getElementById('monthList').innerHTML = DATA.monthly.map(m=>{
    const sc = statusClass(m.Status);
    return `<div class="month-row" onclick="jumpToMonth('${m.Month}')">
      <div class="month-badge">${m.Month}</div>
      <div class="month-info">
        <div class="name">${MONTH_LABEL[m.Month]||m.MonthLabel||m.Month}</div>
        <div class="status"><span class="status-pill ${sc}">${statusLabel(m.Status)}</span></div>
      </div>
      <div class="month-amt">${fmtRMshort(m.Total)}</div>
    </div>`;
  }).join('');
}

function jumpToMonth(month){
  currentMonth = month;
  switchView('records');
  renderMonthChips();
  renderRecords();
}

function switchView(view){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
}

function renderMonthChips(){
  document.getElementById('monthChips').innerHTML = MONTH_ORDER.map(m=>{
    return `<button class="chip ${m===currentMonth?'active':''}" data-month="${m}">${m}</button>`;
  }).join('');
  document.querySelectorAll('.chip').forEach(c=>{
    c.onclick = ()=>{ currentMonth = c.dataset.month; renderMonthChips(); renderRecords(); };
  });
}

function getCurrentList(){
  const q = (document.getElementById('searchInput').value||'').toUpperCase().trim();
  let list;
  if(currentCat==='expenses') list = DATA.expenses;
  else if(currentCat==='fuel') list = DATA.fuel;
  else if(currentCat==='tg') list = DATA.tg;
  else list = DATA.erp;

  if(currentMonth) list = list.filter(r=>r.Month===currentMonth);
  if(q){
    list = list.filter(r => JSON.stringify(r).toUpperCase().includes(q));
  }
  return list;
}

function renderRecords(){
  const list = getCurrentList();
  const el = document.getElementById('recordsList');
  if(list.length===0){
    el.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 2h6l3 4v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6l3-4Z"/></svg>
      <p>Tiada rekod dijumpai untuk pilihan ini.</p>
    </div>`;
    return;
  }
  if(currentCat==='expenses'){
    el.innerHTML = list.map(r=>`<div class="rec-card">
      <div class="rec-top"><span class="rec-cat">${r.Category||''}</span><span class="rec-amt">${fmtRM(r.Amount)}</span></div>
      <div class="rec-title">${r.LocationSupplier||''}</div>
      <div class="rec-meta">${r.BillingPeriod?('<b>Tempoh:</b> '+r.BillingPeriod+'<br>'):''}${r.AccountRef?('<b>Rujukan:</b> '+r.AccountRef+'<br>'):''}${r.Remarks?('<b>Catatan:</b> '+r.Remarks):''}</div>
    </div>`).join('');
  } else if(currentCat==='fuel' || currentCat==='tg'){
    el.innerHTML = list.map(r=>`<div class="rec-card">
      <div class="rec-top"><span class="rec-cat">${r.Vehicle||''}</span><span class="rec-amt">${fmtRM(r.Amount)}</span></div>
      <div class="rec-meta"><b>Bulan:</b> ${MONTH_LABEL[r.Month]||r.Month}</div>
    </div>`).join('');
  } else {
    el.innerHTML = list.map(r=>{
      const sc = statusClass(r.Status);
      return `<div class="rec-card">
      <div class="rec-top"><span class="rec-cat">${r.ERPType||''} · ${r.Category||''}</span><span class="rec-amt">${r.Amount?fmtRM(r.Amount):'—'}</span></div>
      <div class="rec-title">${r.Description||''}</div>
      <div class="rec-meta"><b>Pembekal:</b> ${r.Supplier||'—'}<br><b>Tarikh ERP:</b> ${r.ERPDate||'—'} ${r.Quantity?('· <b>Kuantiti:</b> '+r.Quantity):''}</div>
      <div class="rec-status"><span class="status-pill ${sc==='ok'?'ok':(sc==='review'?'review':'empty')}">${r.Status||'—'}</span></div>
    </div>`;
    }).join('');
  }
}

// ---- Event wiring ----
document.querySelectorAll('.tab-btn').forEach(b=> b.onclick = ()=> switchView(b.dataset.view));
document.querySelectorAll('.nav-btn').forEach(b=> b.onclick = ()=> switchView(b.dataset.view));
document.querySelectorAll('.subtab').forEach(b=> b.onclick = ()=>{
  document.querySelectorAll('.subtab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  currentCat = b.dataset.cat;
  renderRecords();
});
document.getElementById('searchInput').addEventListener('input', renderRecords);
document.getElementById('refreshBtn').onclick = ()=>{
  document.getElementById('refreshBtn').classList.add('spinning');
  loadAllData().finally(()=>{
    document.getElementById('refreshBtn').classList.remove('spinning');
    showToast('Data disegarkan');
  });
};

renderMonthChips();
loadAllData();

// ---- Installable PWA: service worker + install prompt ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW register failed', err));
  });
}

let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.style.display = 'flex';
});

installBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  installBtn.style.display = 'none';
  deferredInstallPrompt.prompt();
  const choice = await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  if (choice.outcome === 'accepted') showToast('App sedang dipasang…');
});

window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
  deferredInstallPrompt = null;
  showToast('App berjaya dipasang!');
});
</script>
